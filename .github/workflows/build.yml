name: Build & Push (Static Portfolio via Pi)

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: [self-hosted, arm64] # your Raspberry Pi runner
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build image (native arm64)
        run: |
          docker build -t ghcr.io/${{ secrets.GHCR_USERNAME }}/portfolio:latest .

      - name: Push image
        run: |
          docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/portfolio:latest
