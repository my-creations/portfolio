name: Build & Push (Portfolio via Pi)

on:
  push:
    branches: ["main", "master"] # inclui master por segurança
  workflow_dispatch: {}

jobs:
  build:
    runs-on: [self-hosted, arm64] # Raspberry Pi runner
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }} # teu username pessoal
          password: ${{ secrets.GHCR_TOKEN }} # PAT com write:packages + acesso à org

      - name: Build image (native arm64)
        run: |
          docker build -t ghcr.io/my-creations/portfolio:latest .

      - name: Push image
        run: |
          docker push ghcr.io/my-creations/portfolio:latest
